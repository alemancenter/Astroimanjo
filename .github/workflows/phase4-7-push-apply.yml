name: Phase 4.7 Feature Apply

on:
  push:
    branches: [fix/phase4-7-generation-ui]

permissions:
  contents: write

jobs:
  apply-test:
    if: ${{ !contains(github.event.head_commit.message, '[phase4.7-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reuse asserted Phase 4.7 source patch
        shell: bash
        run: |
          awk 'BEGIN{emit=0} /python3 <<'"'"'PY'"'"'/{emit=1;next} /^[[:space:]]*PY[[:space:]]*$/{if(emit){exit}} emit{sub(/^          /,""); print}' .github/workflows/phase4-7-edit-test.yml > /tmp/phase47.py
          test -s /tmp/phase47.py
          python3 /tmp/phase47.py
      - name: Install dependencies
        run: npm ci
      - name: Astro type check
        run: npx astro check
      - name: Production build
        run: npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit verified Phase 4.7 source
        shell: bash
        run: |
          printf 'verified-by-github-actions\n' > .phase4-7-verified
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/ArticleForm.astro src/components/dashboard/PostForm.astro .phase4-7-verified
          git commit -m "feat(ai): show generation provenance and draft quality [phase4.7-applied]"
          git push origin HEAD:fix/phase4-7-generation-ui
