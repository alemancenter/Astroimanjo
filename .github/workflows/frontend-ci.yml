name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Astro type check
        run: npx astro check
      - name: Production build
        env:
          PUBLIC_API_URL: https://api.imanjo.com
          INTERNAL_API_URL: https://api.imanjo.com
          FRONTEND_API_KEY: ci-placeholder-not-a-production-secret
          PUBLIC_SITE_URL: https://imanjo.com
        run: npm run build
      - name: Validate whitespace
        run: git diff --check
