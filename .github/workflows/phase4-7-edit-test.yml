name: Phase 4.7 Apply Verified UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-verified-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 4.7 frontend branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase4-7-generation-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply asserted Phase 4.7 source patch
        shell: bash
        run: |
          awk 'BEGIN{emit=0} /python3 <<'"'"'PY'"'"'/{emit=1;next} /^[[:space:]]*PY[[:space:]]*$/{if(emit){exit}} emit{sub(/^          /,""); print}' .github/workflows/phase4-7-edit-test.yml > /tmp/phase47.py
          test -s /tmp/phase47.py
          python3 /tmp/phase47.py

      - name: Install dependencies
        run: npm ci

      - name: Astro type check
        run: npx astro check

      - name: Production build
        env:
          PUBLIC_API_URL: https://api.imanjo.com
          INTERNAL_API_URL: https://api.imanjo.com
          FRONTEND_API_KEY: ci-placeholder-not-a-production-secret
          PUBLIC_SITE_URL: https://imanjo.com
        run: npm run build

      - name: Validate Phase 4.7 patch
        shell: bash
        run: |
          git diff --check
          grep -q 'ai-generation-source-status' src/components/dashboard/ArticleForm.astro
          grep -q 'post-ai-source-status' src/components/dashboard/PostForm.astro
          grep -q 'draft_quality_score' src/components/dashboard/ArticleForm.astro
          grep -q 'draft_quality_score' src/components/dashboard/PostForm.astro
          grep -q 'general_knowledge_fallback' src/components/dashboard/ArticleForm.astro
          grep -q 'general_knowledge_fallback' src/components/dashboard/PostForm.astro

      - name: Commit verified source to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/ArticleForm.astro src/components/dashboard/PostForm.astro
          if git diff --cached --quiet; then
            echo "Phase 4.7 source already applied"
            exit 0
          fi
          git commit -m "feat(ai): show generation provenance and draft quality [phase4.7-verified]"
          git push origin HEAD:fix/phase4-7-generation-ui
